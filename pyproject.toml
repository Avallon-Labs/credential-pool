[project]
name = "credential-pool"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["boto3>=1.36"]

[project.optional-dependencies]
dev = ["moto>=5.1", "pytest"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["credential_pool"]
